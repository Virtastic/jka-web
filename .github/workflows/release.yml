name: release

# Runs on the Virtastic OVH runner (same box as the deploy). Tag pushes come from maintainers,
# so there is no untrusted-input concern here.
#
# MANUAL STEP: the free demo pak is not in this repo and cannot be produced here. Once the
# release exists, attach it:
#   gh release upload <tag> -R Virtastic/jka-web "<path>/jka-demo-assets0.pk3#Free Jedi Academy demo pak (place at demo/assets0.pk3)"
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re-)build the release for
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: [self-hosted, ovh, virtastic]
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Corresponding source archive (the GPLv2 offer)
        run: |
          git archive --format=tar.gz --prefix=jka-web-${TAG}/ -o jka-web-src-${TAG}.tar.gz ${TAG}
          ls -la jka-web-src-${TAG}.tar.gz

      - name: Build the engine in the pinned toolchain
        run: |
          docker run --rm -v "$PWD":/w -w /w alpine:3 rm -rf build-jka
          docker run --rm -v "$PWD":/src -w /src emscripten/emsdk:6.0.1 sh -c '
            bash shared/wasm-build/build-jka.sh &&
            bash shared/wasm-build/build-jka-modules.sh'
          test ! -s build-jka/build.errs
          test ! -s build-jka/modules/build.errs
          test "$(stat -c%s play/jka/qagame.wasm)" -gt 262144

      - name: Stage the runnable bundle
        run: |
          rm -rf bundle && mkdir -p bundle
          cp play/jka/index.html play/jka/launcher.html bundle/
          cp play/jka/jka.js play/jka/jka.wasm play/jka/qagame.wasm bundle/
          cp shared/web/server.py bundle/
          cp infra/nginx.conf bundle/
          cp README.md SELF_HOSTING.md LICENSE NOTICE.md THIRD-PARTY-LICENSES.md bundle/
          (cd bundle && zip -qr ../jka-web-${TAG}.zip .)
          ls -la jka-web-${TAG}.zip

      - name: Publish the container image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          DOCKER_BUILDKIT=1 docker build --target runtime             -t ghcr.io/virtastic/jka-web:${TAG} -t ghcr.io/virtastic/jka-web:latest .
          docker push ghcr.io/virtastic/jka-web:${TAG}
          docker push ghcr.io/virtastic/jka-web:latest

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            jka-web-src-*.tar.gz
            jka-web-*.zip

      - name: Tidy
        if: always()
        run: docker run --rm -v "$PWD":/w -w /w alpine:3 rm -rf build-jka bundle jka-web-src-*.tar.gz jka-web-*.zip
