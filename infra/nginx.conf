# nginx baked into the jka:ovh image. Plain HTTP:80; the shared edge Caddy (+ Cloudflare) do TLS.
# server_name is a catch-all — the edge already routed here by Host.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation on EVERY response (SharedArrayBuffer / wasm) — set here so it survives
    # regardless of the edge config. The edge deliberately does NOT duplicate these (a duplicate
    # COOP/COEP silently breaks crossOriginIsolated).
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    # PREVIEW posture: keep this deploy out of search engines entirely.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types application/javascript application/wasm text/css image/svg+xml;
    # NB: nginx 1.27's mime.types already maps .wasm -> application/wasm. Do NOT add a bare
    # `types {}` block — it REPLACES the whole map and breaks text/html.

    # PREVIEW: deny all crawlers.
    location = /robots.txt {
        add_header Content-Type text/plain always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # index.html is the themed launcher / landing page.
    location = / { try_files /index.html =404; }

    # Immutable engine + data artifacts: cache hard at the edge + browser. New build => new bytes;
    # purge the Cloudflare cache (or bump names) on redeploy of the mutable index.html only.
    location ~* \.(wasm|data|js|pk3)$ {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ =404; }
}
